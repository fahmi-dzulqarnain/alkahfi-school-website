<div class="padding flex-column">
    <feature-title
    title="Galeri"
    iconPath="assets/icons/galeri/galeri_icon.png"
    iconSize="large"/>

    <div class="content-container">
        <div class="leading-column">
            <p-orderList [value]="galleriList" [listStyle]="{ 'max-height': '30rem' }" header="List Foto" filterBy="name" filterPlaceholder="Cari">
                <ng-template pTemplate="galleri">
                    @for(foto of galleriList; track $index) {
                        <div class="flex flex-wrap p-2 align-items-center gap-3 clickable-with-divider padding-default" (click)="onClickDetail(foto)">
                            <img [src]="imgSource" class="leading-column"/>
                            <div class="flex-1 flex flex-column gap-2 leading-column with-gap-small">
                                <span class="font-bold">{{foto.judulFoto}}</span>
                                <div class="flex align-items-center gap-2">
                                    <i class="pi pi-tag text-sm"></i>
                                    <span>{{foto.kontenFoto}}</span>
                                </div>
                                <div class="flex-row">
                                    <span class="font-bold text-900">{{foto.penulis}}</span>
                                    <span class="font-bold text-900">{{foto.tanggalKirim}}</span>
                                </div>
                            </div>

                        </div>
                    }
                </ng-template>
            </p-orderList>
            <data-menu-bar class="leading-column margin-top" [buttons]="dataMenuButtons"/>
        </div>

        @if(isShowForm) {
            <div class="padding flex-column trailing-column">
                <h2>{{ formTitle }}</h2>

                <form
                    class="flex-column margin-top with-gap-large"
                    [formGroup]="galleriForm" >

                    <div class="flex-column with-gap">
                        <label>Foto</label>
                        <p-image
                            class="img-news-placeholder"
                            [src]="imgSource"
                            alt="ini adalah sekolah fajar ilahi"
                            [preview]="true" />

                        <p-fileUpload
                            mode="basic"
                            name="demo[]"
                            url="https://www.primefaces.org/cdn/api/upload.php"
                            accept="image/*"
                            [maxFileSize]=1000000
                            (onUpload)="onBasicUploadAuto($event)"
                            [auto]="true"
                            [chooseIcon]="iconUpload"
                            chooseLabel="Unggah Foto"/>

                            <div class="leading-column flex-column with-gap-large">
                                <div class="flex-column with-gap-small">
                                    <label for="inputJudulBerita">Judul Foto</label>
                                    <input
                                        pInputText
                                        id="inputJudulBerita"
                                        formControlName="judulFoto" />
                                </div>
                                <div class="flex-column with-gap-small">
                                    <label for="inputKonten">Konten Foto</label>
                                    <textarea
                                        pInputTextarea
                                        id="inputKonten"
                                        formControlName="kontenFoto"
                                        [autoResize]="true"
                                        ></textarea>
                                </div>
                                <div class="flex-column with-gap-small">
                                    <label for="inputTanggalKirim">Tanggal</label>
                                    <p-calendar
                                        id="inputTanggalKirim"
                                        formControlName="tanggalKirim"
                                        dateFormat="dd-mm-yy"
                                        [touchUI]="true"/>
                                </div>
                                <div class="flex-column with-gap-small">
                                    <label for="inputPenulis">Penulis</label>
                                    <input
                                        pInputTextarea
                                        id="inputPenulis"
                                        formControlName="penulis" />
                                </div>
                            </div>


                    </div>

                    <div class="flex-row gravity-end with-gap-small margin-top">

                        <button
                            pButton
                            pRipple
                            class="outlined"
                            (click)="onCancel()">
                            <h4>
                                Batalkan
                            </h4>
                        </button>

                        <button
                            pButton
                            pRipple
                            (click)="onSave()">
                            <h4>
                                Simpan Perubahan
                            </h4>
                        </button>
                    </div>

                </form>

            </div>
        } @else {
            <no-data
                imageSource="assets/icons/galeri/dimana_foto.png"
                description="Pilih Salah Satu Foto Untuk Melihat Detail atau Mengubah"/>
        }

    </div>
</div>
