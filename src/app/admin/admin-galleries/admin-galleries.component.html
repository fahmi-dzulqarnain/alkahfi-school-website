<div class="flex-column">
    <div class="content-container-no-margin">
        @if (isDataExists()) {
        <div class="
            leading-column-small
            auto-height
            padding
            white-background
            sidebar">

            <feature-title
                title="Daftar Galeri"
                iconPath="assets/icons/galeri/galeri_icon.png"
                iconSize="medium" />

            <data-menu-bar
                [buttons]="dataMenuButtons"
                [isButtonCentered]="true"
                (searchKeyword)="onSearch($event)"
                class="padding-default" />

            @for(galeri of galeriList; track $index) {
            <div class="flex-column
                with-gap
                clickable-with-divider
                padding-default"
                (click)="onClickDetail(galeri)">

                <h3>{{ galeri.judul }}</h3>
                <p>{{ galeri.deskripsi }}</p>
            </div>
            }

            <p-paginator
                [first]="first"
                [rows]="limit"
                [totalRecords]="totalRecords()"
                (onPageChange)="onPageChange($event)"
                [showCurrentPageReport]="true"
                currentPageReportTemplate="{first} - {last} dari {totalRecords}"
                [showPageLinks]="false"
                [showFirstLastIcon]="false" />
        </div>
        }

        @if(isShowForm) {
        <div class="
            flex-column
            padding
            margin-top-default"
            [ngClass]="isDataExists() ? 'trailing-column-big' : 'container-width'">

            <form
                class="flex-column margin-top with-gap-large container-width"
                [formGroup]="galeriForm">

                <div class="flex-column with-gap-small">
                    <label
                        for="inputJudulGaleri"
                        class="bold">
                        Judul
                    </label>
                    <input
                        pInputText
                        id="inputJudulGaleri"
                        formControlName="judul" />
                </div>

                @if (gambarURLs.length !== 0) {
                <p-galleria
                    class="margin-horizontal-auto"
                    [value]="gambarURLs"
                    [autoPlay]="true"
                    [circular]="true"
                    [responsiveOptions]="responsiveOptions"
                    [numVisible]="5"
                    [containerStyle]="{ 'max-width': '640px' }">
                    <ng-template pTemplate="item" let-item>
                        <img
                            src="{{ baseUrl }}/{{ item }}"
                            class="galeri-item" />
                    </ng-template>
                    <ng-template pTemplate="thumbnail" let-item>
                        <div class="grid grid-nogutter justify-content-center">
                            <img src="{{ baseUrl }}/{{ item }}"
                                style="max-height: 5rem; object-fit: contain; " />
                        </div>
                    </ng-template>
                </p-galleria>
                }

                <div class="flex-row with-gap-large">

                    <div class="flex-column with-gap full-width">
                        <label class="bold">Upload Gambar:</label>

                        <image-uploader
                            [isSupportMultipleFiles]="true"
                            (gambarIDs)="gambarIDs = $event" />
                    </div>

                    <div class="flex-column with-gap-small">
                        <label
                            for="inputDeskripsi"
                            class="bold">
                            Deskripsi
                        </label>
                        <textarea
                            pInputTextarea
                            id="inputDeskripsi"
                            [cols]="50"
                            [rows]="5"
                            formControlName="deskripsi"></textarea>
                    </div>
                </div>

                <div class="
                    flex-row
                    gravity-end
                    with-gap-small
                    margin-vertical">

                    <button
                        pButton
                        pRipple
                        class="outlined"
                        (click)="onCancel()">
                        <h4>
                            Batalkan
                        </h4>
                    </button>

                    <button
                        pButton
                        pRipple
                        (click)="onSave()">
                        <h4>
                            Simpan Perubahan
                        </h4>
                    </button>
                </div>

            </form>
        </div>
        } @else {
        <no-data
            imageSource="assets/icons/galeri/galeri_icon.png"
            featureName="Galeri"
            [hasData]="isDataExists()"
            [ngClass]="isDataExists() ? 'big' : 'full-width'"
            (onAddData)="onAdd()" />
        }
    </div>
</div>
