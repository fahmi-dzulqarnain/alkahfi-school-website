@for(berita of beritaList; track $index) {
    <div class="flex-column clickable-with-divider padding-default" (click)="onClickDetail(berita)">
        <h3>{{ berita.judulBerita }}</h3>
        <p>{{ berita.konten }}</p>
        <div class="text-year">
            <div class="cover__sub__details">
                <div class="sub__details"><span class="ri-time-fill"></span> {{ berita.tanggalKirim }}</div>
                <div class="sub__details"><span class="ri-user-fill"></span> {{ berita.penulis }} </div>
            </div>
        </div>
    </div>
}
