<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.js"></script>
<link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css"
    rel="stylesheet">

<div class="flex-column">
    <div class="content-container-no-margin">
        @if (isDataExists()) {
        <div class="
            leading-column-small
            auto-height
            padding
            white-background
            sidebar">

            <feature-title
                title="Daftar Berita"
                iconPath="assets/icons/berita/berita_icon.png"
                iconSize="medium" />

            <data-menu-bar
                [buttons]="dataMenuButtons"
                [isButtonCentered]="true"
                (searchKeyword)="onSearch($event)"
                class="padding-default" />

            @for(berita of beritaList; track $index) {
            <div class="flex-column
                with-gap
                clickable-with-divider
                padding-default"
                (click)="onClickDetail(berita)">

                <h3>{{ berita.judul }}</h3>
                <p>{{ berita.kontenPreview }}</p>
                <div class="flex-row with-gap-tiny">
                    <span
                        class="ri-time-fill margin-center-vertical"></span>
                    <p>{{ berita.createdAt }}</p>
                </div>
            </div>
            }

            <p-paginator
                [first]="first"
                [rows]="limit"
                [totalRecords]="totalRecords()"
                (onPageChange)="onPageChange($event)"
                [showCurrentPageReport]="true"
                currentPageReportTemplate="{first} - {last} dari {totalRecords}"
                [showPageLinks]="false"
                [showFirstLastIcon]="false" />
        </div>
        }

        @if(isShowForm) {
        <div class="
            flex-column
            padding
            margin-top-default"
            [ngClass]="isDataExists() ? 'trailing-column-big' : 'container-width'">

            <form
                class="flex-column margin-top with-gap-large container-width"
                [formGroup]="beritaForm">

                <div class="flex-column with-gap-small">
                    <label
                        for="inputJudulBerita"
                        class="bold">
                        Judul
                    </label>
                    <input
                        pInputText
                        id="inputJudulBerita"
                        formControlName="judul" />
                </div>

                <div class="flex-row with-gap">

                    <div class="flex-column with-gap full-width">
                        <label class="bold">Gambar Berita</label>

                        <image-uploader
                            [isSupportMultipleFiles]="false"
                            [imagePlaceholder]="beritaForm.get('gambarIlustrasi').value"
                            (gambarIDs)="gambarIDs = $event" />
                    </div>

                    <div class="flex-column with-gap-large"
                        [ngClass]="isDataExists() ? '' : 'full-width'">
                        <div class="flex-column with-gap-small">
                            <label
                                for="inputStatus"
                                class="bold">
                                Status
                            </label>
                            <p-selectButton
                                id="inputStatus"
                                [options]="statusOptions"
                                formControlName="status"
                                optionLabel="name"
                                optionValue="value" />
                        </div>
                        <div class="flex-column with-gap-small">
                            <label
                                for="inputKonten"
                                class="bold">
                                Konten
                            </label>
                            <p-editor
                                formControlName="kontenHTML"
                                [style]="{ height: '35rem' }" />
                        </div>
                    </div>
                </div>

                <div class="
                    flex-row
                    gravity-end
                    with-gap-small
                    margin-vertical">

                    <button
                        pButton
                        pRipple
                        class="outlined"
                        (click)="onCancel()">
                        <h4>
                            Batalkan
                        </h4>
                    </button>

                    <button
                        pButton
                        pRipple
                        (click)="onSave()">
                        <h4>
                            Simpan Perubahan
                        </h4>
                    </button>
                </div>

            </form>
        </div>
        } @else {
        <no-data
            imageSource="assets/icons/berita/berita_icon.png"
            featureName="Berita"
            [hasData]="isDataExists()"
            [ngClass]="isDataExists() ? 'big' : 'full-width'"
            (onAddData)="onAdd()" />
        }
    </div>
</div>
