<div class="padding flex-column">
    <h2>Detail Sekolah</h2>

    <form
        class="flex-column margin-top"
        [formGroup]="editForm" >

        <div class="flex-row">
            <p-image
                [src]="imgSource"
                alt="logo"
                [preview]="true" />

            <p-fileUpload
                mode="basic"
                name="demo[]"
                url="https://www.primefaces.org/cdn/api/upload.php"
                accept="image/*"
                [maxFileSize]=1000000
                (onUpload)="onBasicUploadAuto($event)"
                [auto]="true"
                [chooseIcon]="iconUpload"
                chooseLabel="Unggah Logo Lain"/>
        </div>

        <div class="flex-row margin-top">
            <label for="inputNamaSekolah">Nama Sekolah</label>
            <input
                pInputText
                id="inputNamaSekolah"
                formControlName="namaSekolah" />
        </div>

        <div class="flex-row">
            <label for="inputSlogan">Slogan</label>
            <input
                pInputText
                id="inputSlogan"
                formControlName="slogan" />
        </div>

        <div class="flex-row">
            <label for="inputAlamat">Alamat</label>
            <input
                pInputTextarea
                id="inputAlamat"
                formControlName="alamat" />
        </div>

        <div class="flex-row">
            <label for="inputKecamatan">Kecamatan</label>
            <p-autoComplete
                formControlName="kecamatan"
                [required]="true"
                [forceSelection]="true"
                [suggestions]="filteredKecamatan"
                (completeMethod)="filterKecamatan($event)"
                (onSelect)="onKecamatanSelected()" />
        </div>

        <div class="flex-row">
            <label for="inputKelurahan">Kelurahan</label>
            <p-autoComplete
                formControlName="kelurahan"
                [required]="true"
                [forceSelection]="true"
                [suggestions]="filteredKelurahan"
                (completeMethod)="filterKelurahan($event)" />
        </div>

        <div class="flex-row">
            <label for="inputHariBelajar">Hari Belajar</label>
            <p-selectButton
                id="inputHariBelajar"
                formControlName="hariBelajar"
                [options]="days"
                [multiple]="true"
                optionLabel="name"
                optionValue="value"/>
        </div>

        <div class="flex-row">
            <label>Jam Belajar</label>

            <p-calendar
                id="inputAwalBelajar"
                formControlName="jamAwalBelajar"
                [timeOnly]="true"
                [touchUI]="true"/>

            <span id="separator">s.d.</span>

            <p-calendar
                id="inputAkhirBelajar"
                formControlName="jamAkhirBelajar"
                [timeOnly]="true"
                [touchUI]="true"/>
        </div>

        <div class="flex-row">
            <label for="inputKontak">No Telpon</label>
            <input
                pInputText
                id="inputKontak"
                class="smallInput"
                type="tel"
                formControlName="kontak" />
        </div>

        <div class="flex-row">
            <label for="inputEmail">Email</label>
            <input
                pInputText
                id="inputEmail"
                class="smallInput"
                type="email"
                formControlName="email" />
        </div>

        <button
            pButton
            pRipple
            class="button-simpan"
            (click)="onSubmit()">
            <h4>
                Simpan Perubahan
            </h4>
        </button>
    </form>
</div>
