<div class="centered"
    [ngClass]="isMobile ? '' : 'card-login'">

    <logo-branding
        [isVerticalOrientation]="isVerticalOrientation"
        [logoSize]="logoSize" />

    <h2 class="center-content">Masuk Akun</h2>

    <form [formGroup]="loginForm">

        <span class="p-float-label p-input-icon-left">
            <i class="input-icon">
                <fa-icon [icon]="faEnvelope" />
            </i>

            <input
                pInputText
                id="email"
                formControlName="email"
                pKeyFilter="email"
                style="padding-left: 2.5rem;" />

            <label htmlFor="email">
                Email
            </label>
        </span>

        <span class="p-float-label p-input-icon-left">
            <i class="input-icon">
                <fa-icon [icon]="faKey" />
            </i>

            <input
                pPassword
                id="password"
                formControlName="password"
                type="password"
                style="padding-left: 2.5rem;"
                [feedback]="false"
                [pKeyFilter]="blockChars" />

            <label htmlFor="password">
                Password
            </label>
        </span>

        <button
            pButton
            pRipple
            class="button-login"
            (click)="onSubmit()">
            Masuk Akun
        </button>
    </form>

</div>

<p-messages
    class="margin"
    [(value)]="messages"
    life="3000"
    [showTransitionOptions]="'500ms'"
    [hideTransitionOptions]="'500ms'"
    [enableService]="false" />
