<div class="content-container-no-margin padding">

    <div class="padding flex-column container-width">

        <form
            class="flex-column with-gap-large container-width"
            [formGroup]="sekolahForm">

            <feature-title
                title="Detail Sekolah"
                iconPath="assets/icons/informasi/school_icon.png"
                iconSize="medium" />

            <div class="flex-column with-gap-small">
                <label for="inputNamaSekolah">Nama Sekolah</label>
                <input
                    pInputText
                    id="inputNamaSekolah"
                    formControlName="namaSekolah" />
            </div>

            <div class="flex-column with-gap-small">
                <label for="inputSlogan">Slogan</label>
                <input
                    pInputText
                    id="inputSlogan"
                    formControlName="slogan" />
            </div>

            <div class="flex-column with-gap-small">
                <label for="inputAlamat">Alamat</label>
                <input
                    pInputTextarea
                    id="inputAlamat"
                    formControlName="alamat" />
            </div>

            <div class="content-container-no-margin flex-row">
                <div class="leading-column flex-column with-gap-small">
                    <label for="inputKecamatan">Kecamatan</label>
                    <p-autoComplete
                        formControlName="kecamatan"
                        [required]="true"
                        [forceSelection]="true"
                        [suggestions]="filteredKecamatan"
                        (completeMethod)="filterKecamatan($event)"
                        (onSelect)="onKecamatanSelected()" />
                </div>

                <div class="trailing-column flex-column with-gap-small">
                    <label for="inputKelurahan">Kelurahan</label>
                    <p-autoComplete
                        formControlName="kelurahan"
                        [required]="true"
                        [forceSelection]="true"
                        [suggestions]="filteredKelurahan"
                        (completeMethod)="filterKelurahan($event)" />
                </div>
            </div>

            <div class="content-container-no-margin flex-row">
                <div class="leading-column flex-column with-gap-small">
                    <label for="inputNoTelp">No Telpon</label>
                    <input
                        pInputText
                        id="inputNoTelp"
                        type="tel"
                        formControlName="noTelp" />
                </div>

                <div class="trailing-column flex-column with-gap-small">
                    <label for="inputEmail">Email</label>
                    <input
                        pInputText
                        id="inputEmail"
                        type="email"
                        formControlName="email" />
                </div>
            </div>

            <div class="flex-column with-gap-small">
                <label for="inputHariBelajar">Hari Belajar</label>
                <p-multiSelect
                    id="inputHariBelajar"
                    formControlName="hariBelajar"
                    display="chip"
                    [options]="days"
                    [showClear]="true"
                    [maxSelectedLabels]="7"
                    placeholder="Pilih Hari..." />
            </div>

            <div class="flex-column with-gap-small">
                <label>Jam Belajar</label>

                <div class="flex-row">
                    <p-calendar
                        id="inputAwalBelajar"
                        formControlName="jamAwalBelajar"
                        dateFormat="HH.mm"
                        hourFormat="24"
                        [timeOnly]="true"
                        [touchUI]="true" />

                    <span id="separator">s.d.</span>

                    <p-calendar
                        id="inputAkhirBelajar"
                        formControlName="jamAkhirBelajar"
                        dateFormat="HH:mm"
                        hourFormat="24"
                        [timeOnly]="true"
                        [touchUI]="true" />
                </div>
            </div>

            <div class="gravity-end
                        with-gap-small
                        margin-vertical">

                <button
                    pButton
                    pRipple
                    (click)="onSave()">
                    <h4>
                        Simpan Perubahan
                    </h4>
                </button>
            </div>
        </form>
    </div>
</div>
