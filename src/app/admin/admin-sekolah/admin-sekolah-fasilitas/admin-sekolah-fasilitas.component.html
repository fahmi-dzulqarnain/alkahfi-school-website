<div class="content-container-no-margin padding">
    @if (isDataExists()) {
    <div class="flex-column leading-column with-gap">
        <feature-title
            title=" Data Fasilitas"
            iconPath="assets/icons/fasilitas/fasilitas_icon.png"
            iconSize="medium" />

        <data-menu-bar
            [buttons]="dataMenuButtons"
            (searchKeyword)="onSearch($event)" />

        <p-card>
            @for (fasilitas of fasilitasList; track $index) {
            <div
                class="flex-column
                        clickable-with-divider
                        padding-default"
                (click)="onClickDetail(fasilitas)">

                <h3>{{ fasilitas.namaFasilitas }}</h3>

                <div class="text-year">
                    {{ fasilitas.deskripsi }}
                </div>
            </div>
            }
        </p-card>
    </div>
    }

    @if (isShowForm()) {
    <div
        class="padding flex-column margin-top"
        [ngClass]="isDataExists() ? 'trailing-column' : 'container-width'">

        <form
            class="flex-column with-gap-large container-width"
            [formGroup]="fasilitasForm">

            <h2>{{ formTitle }}</h2>

            <div class="flex-column with-gap-small">
                <label
                    for="inputNamaFasilitas"
                    class="bold">
                    Nama Fasilitas
                </label>
                <input
                    pInputText
                    id="inputNamaFasilitas"
                    formControlName="namaFasilitas" />
            </div>

            <div class="flex-column with-gap full-width">
                <label class="bold">Foto Fasilitas</label>

                <image-uploader
                    [isSupportMultipleFiles]="false"
                    [imagePlaceholder]="fasilitasForm.get('gambarIlustrasi').value"
                    (gambarIDs)="gambarIDs = $event" />
            </div>

            <div class="flex-column with-gap-small">
                <label
                    for="inputDeskripsi"
                    class="bold">
                    Deskripsi
                </label>
                <textarea
                    pInputTextarea
                    id="inputDeskripsi"
                    [cols]="50"
                    [rows]="5"
                    formControlName="deskripsi"></textarea>
            </div>

            <div class="
                flex-row
                gravity-end
                with-gap-small
                margin-vertical">

                <button
                    pButton
                    pRipple
                    class="outlined"
                    (click)="onCancel()">
                    <h4>
                        Batalkan
                    </h4>
                </button>

                <button
                    pButton
                    pRipple
                    (click)="onSave()">
                    <h4>
                        Simpan Perubahan
                    </h4>
                </button>
            </div>
        </form>
    </div>
    } @else {
    <no-data
        imageSource="assets/icons/fasilitas/fasilitas_icon.png"
        featureName="Fasilitas"
        [hasData]="isDataExists()"
        [ngClass]="isDataExists() ? '' : 'full-width'"
        (onAddData)="onAdd()" />
    }
</div>
