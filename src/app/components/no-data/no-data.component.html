<div class="flex-column">
    <img
        src="{{ imageSource() }}"
        alt="{{ getAlt() }}"
        class="no-data-image" />

    <h2>
        {{ getTitle() }}
    </h2>

    <p class="margin-top-default">
        {{ getDescription() }}
    </p>

    @if (hasData() === false) {
    <button
        pButton
        pRipple
        (click)="onAdd()">
        <h4>
            Tambah Data Baru
        </h4>
    </button>
    }
</div>
