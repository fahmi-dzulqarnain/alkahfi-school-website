<section class="section__container tentang__container">
    <div class="tentang_data">
        <div class="tentang_details">
            <h2 class="section_title tentang_title">Fasilitas Tersedia</h2>
            @for (fasilitas of fasilitasNames; track $index) {
            <p class="tentang_details-description">
                <i class="ri-checkbox-circle-fill tentang_details-icon"></i>
                {{ fasilitas }}
            </p>
            }
        </div>
    </div>
    <div class="tentang_foto">
        @for (image of fasilitasImages; track $index) {
        <p-image
            [src]="image"
            alt=""
            class="tentang_img"
            [preview]="true">
        </p-image>
        }
    </div>
</section>
