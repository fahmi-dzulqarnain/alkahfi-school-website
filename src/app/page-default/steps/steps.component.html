<section class="steps">
    <div class="steps_bg">
        <div class="steps_container grid">
            <div class="steps_card">
                <div class="ri-map-pin-fill steps_card-number"></div>
                <h3 class="steps_card-title">Alamat</h3>
                <p class="steps_card-description">
                    {{ sekolah().alamat }}, {{ sekolah().kelurahan }}, {{
                    sekolah().kecamatan }}, Kota {{ sekolah().kota }}
                </p>
            </div>

            <div class="steps_card">
                <div class="ri-time-fill steps_card-number"></div>
                <h3 class="steps_card-title">Waktu Belajar</h3>
                <p class="steps_card-description">
                    {{ hariBelajar() }} <br>Pukul
                    {{ waktuBelajar() }}
                </p>
            </div>

            <div class="steps_card">
                <div class="ri-star-fill steps_card-number"></div>
                <h3 class="steps_card-title">Akreditasi</h3>
                <p class="steps_card-description">
                    Telah Terakreditasi "{{ akreditasi().nilai }}"
                    <br>pada tahun
                    {{ akreditasi().tahun }}
                </p>
            </div>
        </div>
    </div>
</section>
