<div class="section__container header__container" id="beranda">

        imageWidth="100%"
        imageHeight="100%"
        imageSource="{{ sekolah().logo }}" />
    <div class="header__content">
        <div>
            <h1>{{ sekolah().namaSekolah }}</h1>
            <p class="section__subtitle">
                {{ sekolah().slogan }}
            </p>
            <div class="action__btns">
                <a href="#fasilitas" class="btn">
                    <i class="ri-arrow-down-line logo-btn"></i>
                    Pelajari Lebih Lanjut
                </a>
                <a href="https://ppdb.alkahfi.or.id" class="btn">
                    <i class="ri-file-3-fill logo-btn"></i>

            </div>
        </div>
