<section class="section__container" id="galeri">
    <div class="blank">p</div>
    <div class="gallery__title">
        <h2 class="section__subtitle">
            Galeri Album
        </h2>
    </div>
    <div class="gallery__title">
        <h1 class="section__title__big">
            Kegiatan & Acara
        </h1>
    </div>

    @for(galeri of galeriList; track $index) {
    <div class="flex-column
            with-gap
            padding-default">

        <p-galleria
            class="margin-horizontal-auto"
            [value]="gambarURLs"
            [autoPlay]="true"
            [circular]="true"
            [responsiveOptions]="responsiveOptions"
            [numVisible]="5">

            <ng-template pTemplate="item" let-item>
                <p-image
                    class="img-galeri-item"
                    src="{{ item }}"
                    [preview]="true" />
            </ng-template>

            <ng-template
                pTemplate="thumbnail"
                let-item>

                <div class="grid grid-nogutter justify-content-center">
                    <img
                        src="{{ item }}"
                        style="max-height: 4rem; object-fit: contain; " />
                </div>
            </ng-template>

            <ng-template pTemplate="caption" let-item>
                <h4 style="margin-bottom: .5rem; color: #ffffff;">
                    {{ galeri.judul }}
                </h4>
                <p>{{ galeri.deskripsi }}</p>
            </ng-template>
        </p-galleria>
    </div>
    }

    <p-paginator
        [first]="first"
        [rows]="limit"
        [totalRecords]="totalRecords()"
        (onPageChange)="onPageChange($event)"
        [showPageLinks]="true"
        [showFirstLastIcon]="false" />

</section>
